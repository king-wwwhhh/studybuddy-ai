server:
  port: ${SERVER_PORT:9900}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ${FILE_UPLOAD_PATH:C:/Users/joker/study_agent_data/uploads}
    allowed-extensions: txt,md,markdown,pdf,doc,docx,ppt,pptx,xls,xlsx,html,htm,csv,json,tex

# 应用数据目录（SQLite 数据库、GitHub 本地缓存等存放于此）
app:
  data-dir: ${APP_DATA_DIR:C:/Users/joker/study_agent_data}
  master-key: ${APP_MASTER_KEY:study-assistant-default-key}
  # 前端「切换模型」候选池 —— 只是往池子里加名字，不决定优先级。
  # 留空也完全可用：会自动从 /compatible-mode/v1/models 发现聊天模型。
  models: ${APP_MODELS:qwen3.7-max,qwen-max,qwen-plus,qwen-flash}

# ============ 模型自动探测（解决"阿里云改名/下线模型就报错"的问题）============
# 政策：代码里不再写死任何模型名，启动时由 ModelCatalogService 实测得出。
#   1) 候选池 = app.models + 从 /compatible-mode/v1/models 自动发现的聊天模型
#      + 内置兜底(qwen-max/qwen-plus/qwen-flash)；CHAT_MODEL 若设置则作为最高优先
#   2) 候选按「版本号从新到旧」排序（qwen3.9-max 排在 qwen3.7-max 前面）
#   3) 逐个对 DashScope 原生端点 /services/aigc/text-generation/generation
#      发 max_tokens=1 的探测请求，只保留返回 HTTP 200 的
#   4) 取第一个通过探测的作为默认模型 —— 阿里云以后上 qwen3.9-max，会自动用上，不用改代码
#   5) 每 24 小时自动重探一次；运行中请求了已下线的模型会自动降级到可用模型
#   6) POST /api/models/refresh 可手动立即重探（换空间/换密钥后无需重启）
# 所以：阿里云模型名变更时，重启应用即自动恢复；探测失败也还有内置兜底。
chat:
  auto-detect: ${CHAT_AUTO_DETECT:true}
  # only set when a model must be pinned; blank = decided by startup auto-detection (recommended)
  model: ${CHAT_MODEL:}
  # SSE chat executor: bounded threads + bounded queue + CallerRuns backpressure
  executor:
    core-size: ${CHAT_EXEC_CORE:8}
    max-size: ${CHAT_EXEC_MAX:32}
    queue-capacity: ${CHAT_EXEC_QUEUE:200}
    keep-alive-seconds: ${CHAT_EXEC_KEEPALIVE:60}
    thread-name-prefix: chat-sse-
github:
  repo-url: ${GITHUB_REPO_URL:}
  cache-path: ${GITHUB_CACHE_PATH:C:/Users/joker/study_agent_data/github_cache}
  git-executable: git
  push-enabled: ${GITHUB_PUSH_ENABLED:true}

# Milvus 连接：云端 Zilliz Cloud 用 uri+token（MILVUS_URI/MILVUS_TOKEN）；本地用 host+port。
# 连接失败时应用自动降级（RAG 关闭、其余功能正常）。
milvus:
  uri: ${MILVUS_URI:}
  token: ${MILVUS_TOKEN:}
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME:}
  password: ${MILVUS_PASSWORD:}
  database: ${MILVUS_DATABASE:default}
  timeout: ${MILVUS_TIMEOUT:10000}
  # 向量索引选型：auto = 按 collection 行数自动选（≤5万 FLAT / ≤500万 HNSW / 更大 IVF_FLAT）
  # 手工指定请填 FLAT | HNSW | IVF_FLAT；已有 collection 的索引不会被重建，检索参数按实际索引类型取
  index:
    type: auto
    m: 16                 # HNSW 每层连接数
    ef-construction: 200  # HNSW 建图候选宽度
    nlist: 0              # IVF 桶数；0 = 按行数自动算（4·√N，且保证 N ≥ 39·nlist）
    nprobe: 10            # IVF 检索探测桶数
    ef: 64                # HNSW 检索候选宽度，运行时自动抬到 ≥ topK
    # 索引类型变更时是否自动 dropIndex + 按新类型重建（默认 false：重建期间检索会短暂不可用）
    auto-rebuild: ${MILVUS_INDEX_AUTO_REBUILD:false}

spring:
  autoconfigure:
    # 排除全部 DashScope 自动配置：它们会在 DASHSCOPE_API_KEY 为空/缺失时于启动期抛异常，
    # 导致健康检查失败。应用全部手动构建 DashScope 模型（ChatModelFactory/RerankService/VectorEmbeddingService），
    # 不依赖任何 Spring AI 自动配置 bean，排除无害且杜绝启动期 key 校验崩溃。
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
  servlet:
    multipart:
      # Spring Boot 默认单文件上限 1MB，真实的 pdf/pptx/xlsx 几乎都超限（413 空响应）→ 必须调大
      max-file-size: 100MB
      max-request-size: 110MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:C:/Users/joker/study_agent_data/study.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      chat:
        options:
          timeout: 180000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000

dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:your-api-key-here}
  embedding:
    model: text-embedding-v4

document:
  chunk:
    max-size: 800
    overlap: 100

rag:
  # recall width: candidates handed to rerank (must exceed rerank-top-n)
  top-k: 10
  # how many chunks actually enter the prompt after rerank
  rerank-top-n: 3
  # max chunks kept per chapter (chapter-diverse selection)
  max-per-chapter: 2
  # read-back verification sample size (0 disables)
  verify-sample-size: 20
  # bounded retries for read-back verification (0/200/400ms)
  verify-attempts: 3
  verify-retry-base-ms: 200
  # L2^2 threshold (normalized vectors: L2^2 = 2 - 2cos; 1.2 <=> cos~0.4)
  score-threshold: 1.2
  # blank = follow auto-detected model catalog
  model: "${RAG_MODEL:}"

# conversation memory: recallHistory tool lets the model re-read older turns from SQLite
memory:
  recall:
    limit: 5
# 自动 Plan-Execute-Replan：观察执行状态（连续无打卡）自动重排剩余任务
plan:
  auto-replan:
    enabled: true          # 关闭则仅保留手动/教练对话触发重排
    no-checkin-days: 3     # 连续 N 天无打卡即判定计划停滞
    cooldown-days: 7       # 距上次重排至少 N 天才允许再次自动重排

# 检索后重排：走 DashScope 公网 text-rerank 端点（不依赖企业 MaaS 网关）
rerank:
  enabled: true
  base-url: https://dashscope.aliyuncs.com
  model: gte-rerank-v2
